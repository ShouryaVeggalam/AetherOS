name: Feature request
description: Propose a capability that preserves CELESTRA invariants
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Features must pass the [CELESTRA](../../docs/CELESTRA.md) gate:
        problem · evidence · explainability · testability · reproducibility.

        AetherOS remains **userspace / read-only / human-in-the-loop**.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or research problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired behavior (advice / simulation / presentation). Avoid actuation APIs.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Likely layer
      options:
        - v6 Horizon (cloud / twin / graph / planetary / observatory)
        - v5 Nexus (plugins / marketplace / policy / enterprise / API)
        - v4 Distributed
        - v3 Cognitive
        - v2 Intelligence
        - v1 Operating
        - Docs / DX only
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: gate
    attributes:
      label: Acceptance gate
      options:
        - label: I can describe measurable evidence inputs
          required: true
        - label: A human could reconstruct why outputs appear
          required: true
        - label: This does not require AetherOS to mutate the OS / cloud / Kubernetes
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — other approaches or existing modules.
