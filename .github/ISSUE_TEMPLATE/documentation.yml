name: Documentation
description: Improve docs, diagrams, screenshots, or release packaging
title: "[docs] "
labels: ["documentation", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Doc-only changes are welcome. Prefer linking the page under `docs/` or the root README.
  - type: dropdown
    id: doc-area
    attributes:
      label: Documentation area
      options:
        - README / installation
        - Architecture / diagrams
        - Module docs (MODULES.md)
        - Screenshots / demo GIFs
        - Release notes / CHANGELOG
        - Benchmarks
        - Research paper
        - Issue / PR templates
        - Other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What should change?
      description: Missing, outdated, or unclear content.
    validations:
      required: true
  - type: input
    id: links
    attributes:
      label: Links
      description: Paths or URLs (optional)
      placeholder: docs/installation.md
