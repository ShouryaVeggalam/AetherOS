name: Bug report
description: Report a defect in AetherOS (userspace / read-only / HITL)
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping AetherOS.

        **Security issues are not bugs.** See [SECURITY.md](../../SECURITY.md) for private disclosure.
  - type: input
    id: version
    attributes:
      label: Version
      description: Package or git tag (e.g. 6.0.0-Horizon / 5.0.0 / commit SHA)
      placeholder: 6.0.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard / Rich UI
        - Horizon Observatory
        - Cloud Federation
        - Infrastructure Twin
        - Global Knowledge Graph
        - Planetary Scheduler
        - Public API / SDK
        - Plugin SDK / Marketplace
        - Policy Studio
        - Enterprise
        - Telemetry / Resource Graph / Host Twin
        - Federation / Topology / Cluster Scheduler
        - Docs / CI / Packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear, minimal reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Python:
        Install method: pip editable / wheel
        Entry point: aetheros / aetheros-horizon / API
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: This report does not require or describe host mutation, sudo, shell execution, Terraform apply, or kubectl apply by AetherOS.
          required: true
