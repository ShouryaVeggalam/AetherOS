# Continuous integration for AetherOS v5.0 Nexus
name: CI

on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Format · Types · Tests · Coverage · Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pip install build

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format)
        run: black --check .

      - name: Type surface (bytecode compile)
        run: python -m compileall -q aetheros services plugins

      - name: Import cycles
        run: python scripts/check_import_cycles.py

      - name: Pytest + coverage (fail under 90%)
        run: pytest --cov=aetheros --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
