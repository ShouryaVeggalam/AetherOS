# Draft GitHub Releases for annotated version tags (no auto-publish)
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build draft GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install -U pip
          pip install build twine
          pip install -e ".[dev]"

      - name: Quality gate
        run: |
          ruff check .
          black --check .
          python -m compileall -q aetheros services
          python scripts/check_import_cycles.py
          pytest --cov=aetheros --cov-fail-under=90

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Create DRAFT GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: AetherOS ${{ github.ref_name }} — Intelligence
          files: |
            dist/*.whl
            dist/*.tar.gz
          body: |
            AetherOS **${{ github.ref_name }}** — Intelligence (Release Candidate draft).

            This release was created as a **draft**. Human review required before publish.

            ## Install

            ```bash
            pip install dist/aetheros-*.whl
            python -m aetheros
            ```

            See [docs/releases/v2.0.0.md](https://github.com/shouryaveggalam/AetherOS/blob/main/docs/releases/v2.0.0.md),
            [CHANGELOG.md](https://github.com/shouryaveggalam/AetherOS/blob/main/CHANGELOG.md),
            and [SECURITY.md](https://github.com/shouryaveggalam/AetherOS/blob/main/SECURITY.md).

            Recommendation-only. Userspace. MIT License.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
