# Publish GitHub Releases for annotated version tags
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install -U pip
          pip install build twine
          pip install -e ".[dev]"

      - name: Quality gate
        run: |
          ruff check .
          black --check .
          pytest --cov=aetheros --cov-fail-under=80

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
          body: |
            AetherOS **${{ github.ref_name }}** — Operating Intelligence Platform (alpha).

            ## Install

            ```bash
            pip install dist/aetheros-*.whl
            python -m aetheros
            ```

            See [CHANGELOG.md](https://github.com/shouryaveggalam/AetherOS/blob/main/CHANGELOG.md) and [README.md](https://github.com/shouryaveggalam/AetherOS/blob/main/README.md).

            Recommendation-only. Userspace. MIT License.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
