# Draft GitHub Releases for annotated version tags (no auto-publish)
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build draft GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install -U pip
          pip install build twine
          pip install -e ".[dev]"

      - name: Quality gate
        run: |
          ruff check .
          black --check .
          python -m compileall -q aetheros services plugins
          python scripts/check_import_cycles.py
          pytest --cov=aetheros --cov-fail-under=90

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Resolve release title
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == v6* ]]; then
            NAME="AetherOS ${TAG} — Horizon"
            NOTES="docs/releases/v6.0.0.md"
          elif [[ "$TAG" == v5* ]]; then
            NAME="AetherOS ${TAG} — Nexus"
            NOTES="docs/releases/v5.0.0.md"
          else
            NAME="AetherOS ${TAG}"
            NOTES="CHANGELOG.md"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create DRAFT GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: ${{ steps.meta.outputs.name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          body: |
            # ${{ steps.meta.outputs.name }}

            Explainable Operating Intelligence Platform · **Observe · Reason · Simulate · Explain**

            This release was created as a **draft**. Human review required before publish.

            ## Install

            ```bash
            pip install dist/aetheros-*.whl
            python -m aetheros
            aetheros-horizon
            ```

            ## Docs

            - Full notes: [`${{ steps.meta.outputs.notes }}`](https://github.com/ShouryaVeggalam/AetherOS/blob/${{ github.ref_name }}/${{ steps.meta.outputs.notes }})
            - [CHANGELOG.md](https://github.com/ShouryaVeggalam/AetherOS/blob/${{ github.ref_name }}/CHANGELOG.md)
            - [Installation](https://github.com/ShouryaVeggalam/AetherOS/blob/${{ github.ref_name }}/docs/installation.md)
            - [Architecture](https://github.com/ShouryaVeggalam/AetherOS/blob/${{ github.ref_name }}/docs/architecture.md)
            - [Benchmarks](https://github.com/ShouryaVeggalam/AetherOS/blob/${{ github.ref_name }}/docs/benchmarks.md)
            - [SECURITY.md](https://github.com/ShouryaVeggalam/AetherOS/blob/${{ github.ref_name }}/SECURITY.md)

            Recommendation-only. Userspace. MIT License.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
