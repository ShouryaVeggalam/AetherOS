# Continuous integration for AetherOS (Horizon / Nexus)
name: CI

on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Format · Types · Tests · Coverage · Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pip install build

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format)
        run: black --check .

      - name: Type surface (bytecode compile)
        run: python -m compileall -q aetheros services plugins

      - name: Import cycles
        run: python scripts/check_import_cycles.py

      - name: Pytest + coverage (fail under 90%)
        run: pytest --cov=aetheros --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  docs-surface:
    name: Docs surface check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required launch docs exist
        run: |
          set -euo pipefail
          for f in \
            README.md \
            CONTRIBUTING.md \
            CODE_OF_CONDUCT.md \
            SECURITY.md \
            LICENSE \
            docs/installation.md \
            docs/architecture.md \
            docs/architecture/horizon-stack.md \
            docs/benchmarks.md \
            docs/releases/v6.0.0.md \
            docs/MODULES.md \
            docs/screenshots/README.md \
            .github/PULL_REQUEST_TEMPLATE.md \
            .github/ISSUE_TEMPLATE/bug_report.yml \
            .github/ISSUE_TEMPLATE/feature_request.yml \
            .github/ISSUE_TEMPLATE/documentation.yml \
            .github/ISSUE_TEMPLATE/config.yml
          do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo "Launch documentation surface OK"
