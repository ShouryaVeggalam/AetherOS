[pytest]
testpaths = tests services/intelligence/tests
pythonpath = .
asyncio_mode = auto
addopts =
    -q
    --strict-markers
    --cov=aetheros
    --cov-report=term-missing
    --cov-fail-under=90

[coverage:run]
branch = false
source = aetheros
omit =
    aetheros/cli/*
    aetheros/**/__main__.py
    aetheros/dashboard/app.py
    aetheros/atlas/app.py
    aetheros/horizon/app.py
    aetheros/api/app.py

[coverage:report]
precision = 1
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    if __name__ == .__main__.:
    raise NotImplementedError
