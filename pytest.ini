[pytest]
testpaths = tests
pythonpath = .
addopts =
    -q
    --strict-markers
    --cov=aetheros
    --cov-report=term-missing
    --cov-fail-under=80

[coverage:run]
branch = false
source = aetheros
omit =
    aetheros/cli/*
    aetheros/**/__main__.py
    aetheros/dashboard/app.py

[coverage:report]
precision = 1
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    if __name__ == .__main__.:
    raise NotImplementedError
